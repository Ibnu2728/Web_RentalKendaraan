<!-- /mitra/dashboard.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mitra — Dashboard</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<script src="../assets/js/auth.js"></script>
<script>checkAuth('mitra');</script>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="logo">🏢 Mitra Panel</div>
    <nav>
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="mobil-saya.html">🚗 Mobil Saya</a>
      <a href="tambah-mobil.html">➕ Tambah Mobil</a>
      <a href="booking-masuk.html">📋 Booking Masuk</a>
      <a href="pendapatan.html">💰 Pendapatan</a>
      <a href="profil.html">👤 Profil</a>
      <a href="#" onclick="logout(); return false;">🚪 Keluar</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h1>Dashboard Mitra</h1>
      <div class="user-info" id="namaUsaha">🏢 Mitra</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><span class="stat-icon">🚗</span><div><p>Mobil Terdaftar</p><h3 id="statMobil">–</h3></div></div>
      <div class="stat-card"><span class="stat-icon">📋</span><div><p>Booking Aktif</p><h3 id="statBerjalan">–</h3></div></div>
      <div class="stat-card"><span class="stat-icon">💰</span><div><p>Pendapatan Bulan Ini</p><h3 id="statPendapatan">–</h3></div></div>
    </div>

    <section class="table-section">
      <h2>Booking Masuk</h2>
      <table>
        <thead><tr><th>Kode</th><th>Mobil</th><th>Penyewa</th><th>Jenis</th><th>Total</th><th>Aksi</th></tr></thead>
        <tbody id="bookingMasuk">
          <tr><td colspan="6">Memuat data...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<script>
(async () => {
  const tbody = document.getElementById('bookingMasuk');
  try {
    const profil = await (await fetch('../api/mitra.php?action=profil')).json();
    if (profil.success) document.getElementById('namaUsaha').textContent = '🏢 ' + profil.data.nama_usaha;

    const res = await fetch('../api/mitra.php?action=dashboard');
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    document.getElementById('statMobil').textContent = data.ringkasan.total_mobil ?? 0;
    document.getElementById('statBerjalan').textContent = data.ringkasan.booking_berjalan ?? 0;
    document.getElementById('statPendapatan').textContent = 'Rp ' + fmtRp(data.ringkasan.pendapatan_bulan_ini || 0);
    tbody.innerHTML = data.booking_masuk.length ? data.booking_masuk.map(b => `<tr>
      <td>${esc(b.kode_booking)}</td><td>${esc(b.nama_mobil)}</td><td>${esc(b.penyewa)}</td>
      <td>${esc(String(b.jenis_sewa).replace(/_/g, ' '))}</td>
      <td>Rp ${fmtRp(b.total_bayar)}</td>
      <td><a href="booking-masuk.html" class="btn-primary" style="padding:6px 12px; font-size:13px; text-decoration:none;">Kelola</a></td>
    </tr>`).join('') : '<tr><td colspan="6">Belum ada booking masuk.</td></tr>';
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6">❌ ${esc(err.message)}</td></tr>`;
  }
})();
</script>
</body>
</html>
