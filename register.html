<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ditutup — SewaMobil</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f3f4f6; padding: 24px 12px;
    }
    .login-card {
      background: #fff; padding: 36px; border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08); width: 100%; max-width: 440px;
      text-align: center;
    }
    .login-card h2 { margin-bottom: 8px; color: #2563eb; font-size: 24px; }
    .login-card p { color: #6b7280; font-size: 14px; line-height: 1.7; margin-bottom: 16px; }
    .login-card a.btn-primary { display: inline-block; text-decoration: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🚗 SewaMobil</h2>
    <p><strong>Pendaftaran mandiri ditutup.</strong></p>
    <p>Akun SewaMobil dibuatkan oleh admin. Silakan hubungi admin untuk
       dibuatkan akun — admin akan memberikan email dan password untuk Anda
       login pertama kali.</p>
    <a href="login.html" class="btn-primary">Ke Halaman Login</a>
  </div>

</body>
</html>
