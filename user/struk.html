<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Struk Pembayaran</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .struk-wrap { max-width: 600px; margin: 40px auto; background: #fff; padding: 32px; border-radius: 12px; border-top: 8px solid #16a34a; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .struk-header { text-align: center; margin-bottom: 24px; border-bottom: 2px dashed #ddd; padding-bottom: 16px; }
    .struk-header h1 { color: #16a34a; }
    .struk-body td { padding: 8px 0; font-size: 14px; }
    .struk-footer { text-align: center; margin-top: 24px; font-size: 12px; color: #666; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
<script src="../assets/js/auth.js"></script>
<script>checkAuth();</script>

<div class="struk-wrap" id="strukArea">
  <p>Memuat struk...</p>
</div>

<script>
const bookingId = new URLSearchParams(window.location.search).get('booking_id');
const area = document.getElementById('strukArea');

fetch(`../api/struk.php?booking_id=${encodeURIComponent(bookingId)}`)
  .then(r => r.json())
  .then(({ success, data, message }) => {
    if (!success || !data) {
      area.innerHTML = `<p style="color:#b91c1c;">❌ ${esc(message || 'Struk tidak ditemukan.')}</p>
                        <p style="margin-top:16px;"><a href="katalog.html" class="btn-outline">Kembali ke Katalog</a></p>`;
      return;
    }
    area.innerHTML = `
      <div class="struk-header">
        <h1>✅ PEMBAYARAN BERHASIL</h1>
        <p>Terima kasih telah menyewa di SewaMobil</p>
      </div>
      <table class="struk-body" width="100%">
        <tr><td>No. Transaksi</td><td align="right"><b>${esc(data.kode_transaksi)}</b></td></tr>
        <tr><td>Kode Booking</td><td align="right">${esc(data.kode_booking)}</td></tr>
        <tr><td>Nama Penyewa</td><td align="right">${esc(data.penyewa)}</td></tr>
        <tr><td>Mobil</td><td align="right">${esc(data.nama_mobil)}</td></tr>
        <tr><td>Layanan</td><td align="right">${esc(String(data.jenis_sewa).replace(/_/g, ' ').toUpperCase())}</td></tr>
        <tr><td>Durasi</td><td align="right">${esc(data.total_hari)} Hari</td></tr>
        <tr><td>Tanggal Sewa</td><td align="right">${esc(data.tgl_mulai)} s/d ${esc(data.tgl_selesai)}</td></tr>
        <tr><td>Harga / hari</td><td align="right">Rp ${fmtRp(data.harga_per_hari)}</td></tr>
        <tr><td>Deposit</td><td align="right">Rp ${fmtRp(data.deposit)}</td></tr>
        <tr><td colspan="2"><hr></td></tr>
        <tr><td><b>TOTAL BAYAR</b></td><td align="right" style="color:#16a34a; font-size:18px;"><b>Rp ${fmtRp(data.total_bayar)}</b></td></tr>
      </table>
      <div class="struk-footer">
        <p>Dibayar pada: ${esc(new Date(String(data.paid_at).replace(' ', 'T')).toLocaleString('id-ID'))}</p>
      </div>
      <div class="no-print" style="margin-top:24px; text-align:center;">
        <button onclick="window.print()" class="btn-primary" style="padding:12px 24px;">🖨️ Cetak Struk</button>
        <a href="katalog.html" class="btn-outline" style="padding:12px 24px;">Kembali ke Katalog</a>
      </div>`;
  })
  .catch(err => { area.innerHTML = `<p style="color:#b91c1c;">❌ ${esc(err.message)}</p>`; });
</script>
</body>
</html>
